name: Update spoiler-free calendars
on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendar-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest test_world_rugby.py test_plex_nfo.py test_build_rugby_calendars.py
      - name: Detect Atlas rugby publication handoff
        id: atlas
        run: |
          if test -f .github/atlas-rugby-active; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Legacy rugby calendar refresh
        if: steps.atlas.outputs.active != 'true'
        run: python filter.py
      - name: Build Plex NFO metadata
        if: steps.atlas.outputs.active != 'true'
        id: plex
        continue-on-error: true
        env:
          PREM_APP_ID: ${{ secrets.PREM_APP_ID }}
          PREM_API_KEY: ${{ secrets.PREM_API_KEY }}
          PREM_REALM: ${{ secrets.PREM_REALM }}
        run: python plex_nfo.py
      - name: Commit calendars and Plex metadata
        if: steps.atlas.outputs.active != 'true' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update spoiler-free calendars"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo "::error::Could not publish rugby calendars after three non-force pushes."
            exit 1
          fi
      - name: Report Plex metadata failure
        if: steps.atlas.outputs.active != 'true' && steps.plex.outcome == 'failure'
        run: |
          echo "::error::Plex metadata could not be refreshed; existing publication retained."
          exit 1
