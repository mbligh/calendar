name: Update NJ hunter paces
on:
  schedule:
    - cron: "43 10 * * *"
  push:
    branches: [main]
    paths:
      - hunter_paces
      - test_hunter_paces
      - requirements.txt
      - docs/index.html
      - .github/workflows/hunter-paces.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendar-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python test_hunter_paces
      - run: python hunter_paces
      - name: Commit changed calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/hunter-paces-nj.ics
          if ! git diff --cached --quiet; then
            git commit -m "Update NJ hunter pace calendar"
            git push
          fi
      # Pages is already configured to publish main/docs automatically.
      # Do not upload/deploy a second Pages artifact from this workflow.
